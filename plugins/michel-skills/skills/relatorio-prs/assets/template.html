</style>

  var painelTempo = null;
  if (D.periodo) {
    var ini = dia(D.periodo.inicio), fim = dia(D.periodo.fim);
    var dias = Math.max(1, Math.round((fim - ini) / 864e5) + 1);
    var passo = dias > 62 ? 7 : 1;
    var nBal = Math.ceil(dias / passo), baldes = new Array(nBal).fill(0);
    prs.forEach(function (p) {
      var d = new Date(p.mergedAt); d = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
      var idx = Math.floor((d - ini) / 864e5 / passo);
      if (idx >= 0 && idx < nBal) baldes[idx]++;
    });
    var maxB = Math.max.apply(null, baldes.concat([1]));
    painelTempo = h('div', { class: 'painel', style: 'grid-column: 1 / -1' },
      h('div', { style: 'display:flex; justify-content:space-between; align-items:baseline; gap:12px' },
        h('span', { class: 'eyebrow' }, passo === 1 ? 'Merges por dia' : 'Merges por semana'),
        h('span', { class: 'timeline-max' }, 'máx. ' + maxB)),
      h('div', { class: 'timeline-wrap' },
        h('div', { class: 'timeline' }, baldes.map(function (n, i) {
          var dt = new Date(ini.getTime() + i * passo * 864e5);
          return h('div', { class: 'col' + (n ? '' : ' zero'), style: 'height:' + (n / maxB * 100) + '%', title: dt.toLocaleDateString('pt-BR', { timeZone: 'UTC', day: '2-digit', month: 'short' }) + ': ' + n });
        }))),
      h('div', { class: 'timeline-eixo' },
        h('span', null, diaFmt(D.periodo.inicio, { day: '2-digit', month: 'short' })),
        h('span', null, diaFmt(D.periodo.fim, { day: '2-digit', month: 'short' }))));
  }
  sPan.appendChild(h('div', { class: 'grid-2' }, painelTipo, painelRisco, painelTempo));
  app.appendChild(sPan);

  // features e correções
  var sFeat = secao('features', 'Features', 'O que chegou de novo', nFeat + (nFeat === 1 ? ' funcionalidade nova' : ' funcionalidades novas') + ' no período.');
  sFeat.appendChild(lista(prs.filter(function (p) { return p.tipo === 'feat'; }), 'Nenhuma feature no período.'));
  app.appendChild(sFeat);

  var corr = prs.filter(function (p) { return ['fix', 'hotfix', 'revert'].indexOf(p.tipo) >= 0; });
  var sFix = secao('correcoes', 'Correções', 'O que foi corrigido', 'Fixes, hotfixes e reverts, com o problema que cada um resolve.');
  sFix.appendChild(lista(corr, 'Nenhuma correção no período.'));
  app.appendChild(sFix);

  var outras = prs.filter(function (p) { return ['feat', 'fix', 'hotfix', 'revert'].indexOf(p.tipo) < 0; }).sort(porRisco);
  var sOut = secao('outras', 'Demais mudanças', 'Refactors, dependências e manutenção');
  sOut.appendChild(outras.length ? h('div', { class: 'compacta' }, outras.map(function (p) {
    return h('div', { class: 'linha' }, linkPR(p), chipTipo(p.tipo),
      h('div', null, h('div', null, p.titulo), p.resumo ? h('div', { class: 'resumo-c' }, p.resumo) : null),
      pillRisco(p.risco));
  })) : h('p', { class: 'vazio' }, 'Nenhuma outra mudança no período.'));
  app.appendChild(sOut);

  // tabela completa
  var sTab = secao('todas', 'Todas as PRs', 'Lista completa');
  var estado = { tipo: null, risco: null, busca: '' };
  var busca = h('input', { id: 'busca', type: 'search', placeholder: 'Buscar por título, autor ou número', 'aria-label': 'Buscar PRs' });
  var btns = [];
  function fb(grupo, valor, rotulo) {
    var b = h('button', { class: 'fbtn', type: 'button', 'aria-pressed': 'false' }, rotulo);
    b.addEventListener('click', function () { estado[grupo] = estado[grupo] === valor ? null : valor; render(); });
    btns.push({ b: b, g: grupo, v: valor });
    return b;
  }
  var filtros = h('div', { class: 'filtros' }, busca,
    tiposOrd.map(function (t) { return fb('tipo', t, tipoInfo(t).nome); }),
    ['alto', 'medio', 'baixo'].filter(function (r) { return cr[r]; }).map(function (r) { return fb('risco', r, 'Risco ' + RISCOS[r].toLowerCase()); }));
  var tbody = h('tbody');
  var contagem = h('p', { class: 'contagem' });
  sTab.appendChild(filtros);
  sTab.appendChild(contagem);
  sTab.appendChild(h('div', { class: 'tabela-wrap' }, h('table', null,
    h('thead', null, h('tr', null, ['PR', 'Tipo', 'Título', 'Autor', 'Merge', 'Linhas', 'Risco', 'Quebra'].map(function (c, i) { return h('th', { class: i === 5 ? 'num' : null }, c); }))),
    tbody)));
  app.appendChild(sTab);
  busca.addEventListener('input', function () { estado.busca = busca.value.trim().toLowerCase(); render(); });

  function render() {
    btns.forEach(function (x) { x.b.setAttribute('aria-pressed', String(estado[x.g] === x.v)); });
    var vis = prs.filter(function (p) {
      if (estado.tipo && p.tipo !== estado.tipo) return false;
      if (estado.risco && p.risco !== estado.risco) return false;
      if (estado.busca) {
        var alvo = (p.titulo + ' ' + p.autor + ' #' + p.numero + ' ' + (p.escopo || '')).toLowerCase();
        if (alvo.indexOf(estado.busca) < 0) return false;
      }
      return true;
    });
    tbody.textContent = '';
    vis.forEach(function (p) {
      var q = (p.quebra && p.quebra.status) || 'nao';
      tbody.appendChild(h('tr', null,
        h('td', null, linkPR(p)), h('td', null, chipTipo(p.tipo)), h('td', null, p.titulo),
        h('td', { class: 'mono' }, p.autor), h('td', { class: 'mono' }, dataCurta(p.mergedAt)),
        h('td', { class: 'num' }, h('span', { class: 'add' }, '+' + fmt(p.adicoes)), ' ', h('span', { class: 'del' }, '−' + fmt(p.remocoes))),
        h('td', null, pillRisco(p.risco)),
        h('td', null, q === 'confirmado' ? h('span', { class: 'risco alto' }, 'Confirmada') : q === 'suspeita' ? h('span', { class: 'risco medio' }, 'Suspeita') : h('span', { class: 'contagem' }, '—'))));
    });
    contagem.textContent = vis.length === prs.length ? prs.length + ' PRs' : vis.length + ' de ' + prs.length + ' PRs';
  }
  render();

  document.getElementById('rodape').textContent = 'Gerado em ' + (D.geradoEm ? diaFmt(D.geradoEm, { day: '2-digit', month: 'long', year: 'numeric' }) : '—') + (D.fonte ? ' · Fonte: ' + D.fonte : '') + (D.analise ? ' · Triagem: ' + (D.analise.triagem || '—') + ', análise de risco: ' + (D.analise.risco || '—') + (D.analise.alcance ? ', alcance medido no código' : ', alcance não medido') : '') + ' · Risco é uma estimativa baseada no conteúdo das PRs; quebra confirmada exige evidência (revert, hotfix ou issue).';

  // visão executiva: tudo acima é a visão técnica
  Array.prototype.forEach.call(app.querySelectorAll('.slide'), function (s) { s.setAttribute('data-visao', 'tecnico'); });
  var E = D.executivo;
  if (E) {
    var STATUS = { 'no-ar': 'No ar', parcial: 'Parcial', adiado: 'Adiado' };
    var SAUDE = { estavel: 'Estável', atencao: 'Atenção', critico: 'Crítico' };
    var refs = function (arr) { return (arr || []).length ? h('span', { class: 'refs' }, 'PRs ' + arr.map(function (n) { return '#' + n; }).join(', ')) : null; };
    var exSecao = function (id, eyebrow, titulo, desc) { var s = secao(id, eyebrow, titulo, desc); s.setAttribute('data-visao', 'executivo'); return s; };
    var entregas = E.entregas || [], correcoes = E.correcoes || [], riscos = E.riscos || [];
    var noAr = entregas.filter(function (x) { return x.status !== 'adiado'; }).length;
    var riscosAltos = riscos.filter(function (x) { return x.nivel === 'alto'; }).length;
    var frag = document.createDocumentFragment();

    var sEx = h('section', { class: 'slide ex-capa', id: 'executivo', 'data-nome': 'Resumo', 'data-visao': 'executivo' },
      h('div', { class: 'slide-head' },
        h('span', { class: 'eyebrow' }, 'Resumo executivo · ' + periodoTxt),
        h('h1', { class: 'manchete' }, E.manchete || nomeRepo),
        h('span', { class: 'repo' }, nomeRepo + ' · ' + prs.length + ' mudanças publicadas em ' + (D.base || 'main'))),
      E.saude ? h('div', { class: 'saude ' + (E.saude.nivel || 'estavel') },
        h('span', { class: 'sinal' }, SAUDE[E.saude.nivel] || E.saude.nivel), h('p', null, E.saude.texto)) : null,
      h('div', { class: 'ex-nums' },
        h('div', { class: 'ex-num' }, h('span', { class: 'valor' }, noAr), h('span', { class: 'rotulo' }, noAr === 1 ? 'entrega no ar' : 'entregas no ar')),
        h('div', { class: 'ex-num' }, h('span', { class: 'valor' }, correcoes.length), h('span', { class: 'rotulo' }, correcoes.length === 1 ? 'problema corrigido' : 'problemas corrigidos')),
        h('div', { class: 'ex-num' + (nQuebra ? ' alerta' : '') }, h('span', { class: 'valor' }, nQuebra), h('span', { class: 'rotulo' }, nQuebra === 1 ? 'mudança que precisou ser desfeita ou corrigida' : 'mudanças que precisaram ser desfeitas ou corrigidas')),
        h('div', { class: 'ex-num' + (riscosAltos ? ' alerta' : '') }, h('span', { class: 'valor' }, riscos.length), h('span', { class: 'rotulo' }, riscos.length === 1 ? 'risco em acompanhamento' : 'riscos em acompanhamento'))));
    frag.appendChild(sEx);

    var sEnt = exSecao('ex-entregas', 'Entregas', 'O que foi entregue');
    sEnt.appendChild(entregas.length ? h('div', { class: 'entregas' }, entregas.map(function (x) {
      return h('article', { class: 'entrega' },
        h('div', { class: 'entrega-top' }, h('span', { class: 'eyebrow' }, x.tema || ''), x.status ? h('span', { class: 'status ' + x.status }, STATUS[x.status] || x.status) : null),
        h('h3', null, x.titulo),
        x.descricao ? h('p', null, x.descricao) : null,
        x.beneficio ? h('p', { class: 'beneficio' }, x.beneficio) : null,
        refs(x.prs));
    })) : h('p', { class: 'vazio' }, 'Nenhuma entrega nova no período.'));
    frag.appendChild(sEnt);

    var sCor = exSecao('ex-correcoes', 'Correções', 'O que foi corrigido');
    sCor.appendChild(correcoes.length ? h('div', { class: 'ex-linhas' }, correcoes.map(function (x) {
      return h('div', { class: 'ex-linha' }, h('h3', null, x.titulo), refs(x.prs), x.descricao ? h('p', null, x.descricao) : null);
    })) : h('p', { class: 'vazio' }, 'Nenhuma correção no período.'));
    frag.appendChild(sCor);

    var sRis = exSecao('ex-riscos', 'Riscos', 'Riscos e o que estamos fazendo');
    sRis.appendChild(riscos.length ? h('div', { class: 'ex-linhas' }, riscos.map(function (x) {
      return h('div', { class: 'ex-linha nivel-' + x.nivel },
        h('h3', null, x.titulo), pillRisco(x.nivel),
        x.descricao ? h('p', null, x.descricao) : null,
        x.acao ? h('p', { class: 'acao' }, h('b', null, 'Ação: '), x.acao) : null,
        (x.responsavel || (x.prs || []).length) ? h('span', { class: 'dono' }, [x.responsavel ? 'Responsável: ' + x.responsavel : null, (x.prs || []).length ? 'PRs ' + x.prs.map(function (n) { return '#' + n; }).join(', ') : null].filter(Boolean).join(' · ')) : null);
    })) : h('p', { class: 'vazio' }, 'Nenhum risco relevante em acompanhamento.'));
    frag.appendChild(sRis);

    if ((E.proximosPassos || []).length || (E.decisoes || []).length) {
      var sProx = exSecao('ex-proximos', 'Próximos passos', 'O que vem agora');
      sProx.appendChild(h('div', { class: 'duas-col' },
        (E.proximosPassos || []).length ? h('div', { class: 'slide-head' }, h('span', { class: 'eyebrow' }, 'Próximos passos'), h('ol', { class: 'atencao-lista' }, E.proximosPassos.map(function (t) { return h('li', null, h('span', null, t)); }))) : null,
        (E.decisoes || []).length ? h('div', { class: 'slide-head' }, h('span', { class: 'eyebrow' }, 'Decisões necessárias'), h('ol', { class: 'atencao-lista' }, E.decisoes.map(function (t) { return h('li', null, h('span', null, t)); }))) : null));
      frag.appendChild(sProx);
    }
    app.insertBefore(frag, app.firstChild);
  }

  // navegação, visão e modo apresentação
  var todos = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var nav = document.getElementById('nav');
  var slides = [], links = [];
  var io = 'IntersectionObserver' in window ? new IntersectionObserver(function (ents) {
    ents.forEach(function (e) { if (e.isIntersecting) links.forEach(function (a, i) { a.classList.toggle('ativo', slides[i] === e.target); }); });
  }, { rootMargin: '-40% 0px -55% 0px' }) : null;
  var visaoAtual = null;
  function mostrarVisao(v, rolar) {
    visaoAtual = v;
    todos.forEach(function (s) { s.hidden = s.getAttribute('data-visao') !== v; });
    slides = todos.filter(function (s) { return !s.hidden; });
    nav.textContent = '';
    links = slides.map(function (s) { var a = h('a', { href: '#' + s.id }, s.getAttribute('data-nome')); nav.appendChild(a); return a; });
    if (io) { io.disconnect(); slides.forEach(function (s) { io.observe(s); }); }
    Array.prototype.forEach.call(document.querySelectorAll('#visao button'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-visao') === v)); });
    try { localStorage.setItem('relatorio-prs-visao', v); } catch (e) {}
    if (rolar) window.scrollTo(0, 0);
  }
  var inicial = 'tecnico';
  if (E) {
    document.getElementById('visao').hidden = false;
    inicial = 'executivo';
    try { var salvo = localStorage.getItem('relatorio-prs-visao'); if (salvo === 'tecnico' || salvo === 'executivo') inicial = salvo; } catch (e) {}
    var alvo = location.hash && document.getElementById(location.hash.slice(1));
    if (alvo && alvo.getAttribute('data-visao')) inicial = alvo.getAttribute('data-visao');
    if (location.hash === '#tecnico') inicial = 'tecnico';
    Array.prototype.forEach.call(document.querySelectorAll('#visao button'), function (b) {
      b.addEventListener('click', function () { if (b.getAttribute('data-visao') !== visaoAtual) mostrarVisao(b.getAttribute('data-visao'), true); });
    });
  }
  mostrarVisao(inicial, false);
  function atual() {
    var y = window.scrollY + 80, idx = 0;
    slides.forEach(function (s, i) { if (s.offsetTop <= y) idx = i; });
    return idx;
  }
  function ir(i) { var s = slides[Math.max(0, Math.min(slides.length - 1, i))]; s.scrollIntoView({ block: 'start' }); }
  var btn = document.getElementById('btn-apresentar');
  btn.addEventListener('click', function () {
    var on = document.documentElement.classList.toggle('apresentando');
    btn.textContent = on ? 'Sair da apresentação' : 'Apresentar';
    try {
      if (on && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {});
      else if (!on && document.fullscreenElement) document.exitFullscreen().catch(function () {});
    } catch (e) {}
    if (on) ir(atual());
  });
  document.addEventListener('fullscreenchange', function () {
    if (!document.fullscreenElement && document.documentElement.classList.contains('apresentando')) {
      document.documentElement.classList.remove('apresentando'); btn.textContent = 'Apresentar';
    }
  });
  document.addEventListener('keydown', function (e) {
    if (!document.documentElement.classList.contains('apresentando')) return;
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].indexOf(e.key) >= 0) { e.preventDefault(); ir(atual() + 1); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp'].indexOf(e.key) >= 0) { e.preventDefault(); ir(atual() - 1); }
  });
})();
</script>
